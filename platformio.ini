; PlatformIO project file. Build: pio run   Flash: pio run -t upload   Logs: pio device monitor
; See docs/firmware.md for Arduino IDE instructions.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Two 1.9 MB app slots, required for web (OTA) firmware updates.
board_build.partitions = min_spiffs.csv
lib_deps =
    chris--a/Keypad@^3.1.1
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    adafruit/Adafruit NeoPixel@^1.12.3
build_src_flags = -Wall
